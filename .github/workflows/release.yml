name: Windows beta release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run dist
      - run: node scripts/verify-package.cjs
      - run: npm run release:checksums
      - name: Publish beta assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          $assets = @(Get-ChildItem dist/Nyapix-*.exe | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --verify-tag --prerelease --title "Nyapix $version - Windows beta" --notes-file RELEASE-NOTES.md @assets ./dist/SHA256SUMS.txt ./PRIVACY.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
